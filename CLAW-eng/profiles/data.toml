name = "data"
description = "Data pipelines: acquisition, transformation, storage, indexing."
critical_surface = "The correctness of what comes in: a pipeline that runs says nothing about the data passing through it."

agents = ["debugger", "data-ingestion", "data-quality-reviewer", "infra", "api-scout", "silent-failure-hunter", "conversation-analyzer"]
cycles = []
recommended_orchestrations = []

shared = [
  "core/conventions.md",
  "core/coding-standards.md",
  "core/architecture-guide.md",
  "core/testing-guide.md",
  "core/debugging-playbook.md",
  "core/review-checklist.md",
  "core/security-guide.md",
  "domain/data-guide.md",
]

[settings]
# Reply style: it governs only what the user reads.
outputStyle = "Reporting"

[settings.permissions]
deny = [
  "Read(./**/.env)", "Read(./**/.env.*)", "Read(./**/*.env)",
  "Read(./**/*.key)", "Read(./**/*.pem)", "Read(./**/*.p12)",
  "Read(./**/dumps/**)", "Read(./**/exports/**)",
]
