# The only piece of infrastructure in this repository. It exists because
# `doctor --strict` and `--json` are documented as being "for CI" and nothing
# was calling them. Keep it to one file, no dependencies, no third-party
# actions beyond the two official ones.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  suite:
    # The product is copied and run wherever the user works, so it is checked
    # on all three desktop platforms. Windows is not optional here:
    # console encoding is the one failure mode this repository already knows
    # about, and only a Windows runner can see it.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: CLAW-eng/tools

    env:
      # The CLI forces UTF-8 on its own streams; trial_install.py does not.
      # Without this, a long dash is enough to fail the run under cp1252.
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # The floor the README promises. Nothing here may need more.
          python-version: '3.11'

      - name: Test suite
        run: python -m unittest discover -s tests -t . -v

      # An installation is the artifact this project actually ships, so the
      # gate runs on a fresh one. This repository's own installation is
      # gitignored and absent from a clean clone, which is why the doctor
      # cannot simply be pointed at the checkout.
      - name: Trial installation
        run: python trial_install.py ../../_build/ci

      - name: Doctor on the trial installation
        run: python -m fwbuild doctor --strict ../../_build/ci
