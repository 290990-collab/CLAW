name = "marketing"
description = "Contenuti e pubblicazione: posizionamento, testo, immagini e campagne di un prodotto."
critical_surface = "Le affermazioni pubbliche sul prodotto: una promessa che il prodotto non mantiene resta letta anche dopo la correzione, e nessun test la vede."

agents = ["market-researcher", "copywriter", "visual-designer", "campaign-planner", "content-analyst", "claim-reviewer"]
cycles = ["launch"]
recommended_orchestrations = ["agent-teams"]

shared = [
  "core/conventions.md",
  "core/coding-standards.md",
  "core/architecture-guide.md",
  "core/testing-guide.md",
  "core/review-checklist.md",
  "core/security-guide.md",
  "domain/marketing-guide.md",
  "domain/marketing-voice.md",
]

[settings]
# Stile di risposta: governa solo ciò che l'utente legge.
outputStyle = "Reporting"

[settings.permissions]
deny = [
  "Read(./**/.env)", "Read(./**/.env.*)", "Read(./**/*.env)",
  "Read(./**/*.key)", "Read(./**/*.pem)", "Read(./**/*.p12)",
]
