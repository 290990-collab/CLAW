name = "library"
description = "Librerie e pacchetti riusabili: il contratto pubblico è il prodotto."
critical_surface = "Il contratto pubblico — firme, semantica, comportamento fra versioni: romperlo rompe codice che non sta in questo repository."

agents = ["debugger", "api-scout", "silent-failure-hunter", "conversation-analyzer", "comment-analyzer"]
cycles = []
recommended_orchestrations = []

shared = [
  "core/conventions.md",
  "core/coding-standards.md",
  "core/architecture-guide.md",
  "core/testing-guide.md",
  "core/debugging-playbook.md",
  "core/review-checklist.md",
  "core/security-guide.md",
]

[settings]
# Stile di risposta: governa solo ciò che l'utente legge.
outputStyle = "Reporting"

[settings.permissions]
deny = [
  "Read(./**/.env)", "Read(./**/.env.*)", "Read(./**/*.env)",
  "Read(./**/*.key)", "Read(./**/*.pem)", "Read(./**/*.p12)",
]
