name = "web"
description = "Siti e applicazioni web dove la resa visiva è parte del prodotto."
critical_surface = "Ciò che l'utente vede e ciò che un estraneo raggiunge: resa visiva e superficie esposta in rete."

agents = ["frontend", "deploy", "security-reviewer", "api-scout", "debugger", "silent-failure-hunter", "conversation-analyzer"]
cycles = ["design"]
recommended_orchestrations = ["agent-teams"]

shared = [
  "core/conventions.md",
  "core/coding-standards.md",
  "core/architecture-guide.md",
  "core/testing-guide.md",
  "core/debugging-playbook.md",
  "core/review-checklist.md",
  "core/security-guide.md",
  "domain/design-guide.md",
]

[settings]
# Stile di risposta: governa solo ciò che l'utente legge.
outputStyle = "Reporting"

[settings.permissions]
deny = [
  "Read(./**/.env)", "Read(./**/.env.*)", "Read(./**/*.env)",
  "Read(./**/*.key)", "Read(./**/*.pem)", "Read(./**/*.p12)",
]
