name = "research"
description = "Ricerca sperimentale: il prodotto è evidenza riproducibile, non software che gira."
critical_surface = "La validità della conclusione: un numero prodotto da un protocollo sbagliato è indistinguibile da uno giusto."

agents = ["debugger", "api-scout", "results-analyst", "literature", "scientific-reviewer", "silent-failure-hunter", "conversation-analyzer"]
cycles = ["research"]
recommended_orchestrations = ["agent-teams"]

shared = [
  "core/conventions.md",
  "core/coding-standards.md",
  "core/architecture-guide.md",
  "core/testing-guide.md",
  "core/debugging-playbook.md",
  "core/review-checklist.md",
  "core/security-guide.md",
  "domain/research-principles.md",
]

[settings]
# Stile di risposta: governa solo ciò che l'utente legge.
outputStyle = "Reporting"

[settings.permissions]
deny = [
  "Read(./**/.env)", "Read(./**/.env.*)", "Read(./**/*.env)",
  "Read(./**/*.key)", "Read(./**/*.pem)", "Read(./**/*.p12)",
  "Read(./**/*.ckpt)", "Read(./**/*.pt)", "Read(./**/*.pth)",
  "Read(./**/*.npy)", "Read(./**/*.npz)", "Read(./**/*.safetensors)",
]
