name = "software"
description = "Applicazioni, servizi, strumenti a riga di comando, software desktop."
critical_surface = "Il comportamento a runtime davanti a input che il progetto non controlla."

agents = ["debugger", "security-reviewer", "api-scout", "silent-failure-hunter", "conversation-analyzer", "comment-analyzer"]
cycles = []
recommended_orchestrations = []

shared = [
  "core/conventions.md",
  "core/coding-standards.md",
  "core/architecture-guide.md",
  "core/testing-guide.md",
  "core/debugging-playbook.md",
  "core/review-checklist.md",
  "core/security-guide.md",
]

[settings]
# Stile di risposta: governa solo ciò che l'utente legge.
outputStyle = "Reporting"

[settings.permissions]
deny = [
  "Read(./**/.env)", "Read(./**/.env.*)", "Read(./**/*.env)",
  "Read(./**/*.key)", "Read(./**/*.pem)", "Read(./**/*.p12)",
]
