name = "llm"
description = "Sistemi in cui un modello linguistico produce testo, decisioni o azioni che il codice usa."
critical_surface = "Il comportamento del modello non sta nel codice: un prompt che regge su tre esempi non dice niente sul resto, e senza valutazione ripetibile ogni modifica è un'opinione."

agents = ["debugger", "api-scout", "scientific-reviewer", "results-analyst", "silent-failure-hunter", "conversation-analyzer", "comment-analyzer"]
cycles = ["research"]
recommended_orchestrations = []

shared = [
  "core/conventions.md",
  "core/coding-standards.md",
  "core/architecture-guide.md",
  "core/testing-guide.md",
  "core/debugging-playbook.md",
  "core/review-checklist.md",
  "core/security-guide.md",
  "domain/research-principles.md",
  "domain/llm-guide.md",
]

[settings]
# Stile di risposta: governa solo ciò che l'utente legge.
outputStyle = "Reporting"

[settings.permissions]
deny = [
  "Read(./**/.env)", "Read(./**/.env.*)", "Read(./**/*.env)",
  "Read(./**/*.key)", "Read(./**/*.pem)", "Read(./**/*.p12)",
]
